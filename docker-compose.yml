services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sector57_dev
      POSTGRES_USER: sector57
      POSTGRES_PASSWORD: sector57
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sector57 -d sector57_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://sector57:sector57@db:5432/sector57_dev
      DEFAULT_SOCIETY_SLUG: sector57
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pnpm --filter @s57/db migrate:deploy &&
      pnpm --filter @s57/api start:prod"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      target: web
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
