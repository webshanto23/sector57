services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sector57_dev
      POSTGRES_USER: sector57
      POSTGRES_PASSWORD: sector57
    # Only this computer can connect (the API uses Docker's internal network).
    # Host port 5433 because a local Postgres (FlyEnv) already uses 127.0.0.1:5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sector57 -d sector57_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://sector57:sector57@db:5432/sector57_dev
      DEFAULT_SOCIETY_SLUG: sector57
      # Signs login tokens. Put JWT_SECRET (32+ random characters) in a .env file next to this one.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env next to docker-compose.yml}
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      # Uploaded photos live in the `media` volume; the API serves them and the browser
      # reaches them through the web container's /api proxy.
      MEDIA_DIR: /app/apps/api/media
      MEDIA_SERVE: "true"
      MEDIA_BASE_URL: http://localhost:3000/api/media
      # Deeds and NID copies from the public forms: never served directly, only through the API.
      PRIVATE_MEDIA_DIR: /app/apps/api/private-media
    volumes:
      - media:/app/apps/api/media
      - private-media:/app/apps/api/private-media
    # Local only: browsers reach the API through the web server's /api proxy.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pnpm --filter @s57/db migrate:deploy &&
      pnpm --filter @s57/api start:prod"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      target: web
      args:
        # Baked into the browser's /api proxy at build time (next.config.ts rewrites);
        # the runtime API_URL below only reaches server-side fetches.
        API_URL: http://api:4000
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  media:
  private-media:
